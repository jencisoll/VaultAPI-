version: "3.9"
services:
  vaultapi:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://vault:vault@postgres:5432/vaultapi?sslmode=disable"
      REDIS_ADDR:   "redis:6379"
      JWT_SECRET:   "super-secret-change-in-production-min-32-chars"
      HTTP_ADDR:    ":8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     vault
      POSTGRES_PASSWORD: vault
      POSTGRES_DB:       vaultapi
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vaultapi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

volumes:
  pg_data:
  redis_data: